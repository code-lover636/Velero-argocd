apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-ui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/code-lover636/Velero-argocd.git
    targetRevision: main
    path: charts/velero-ui
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true